
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault | Secure Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #101b35, #193b65, #087e91);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #172b4d;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .section-title {
            color: #172b4d;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .description {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #087e91;
            box-shadow: 0 0 0 3px rgba(8,126,145,0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #087e91;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #066575;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 25px;
        }

        .security {
            text-align: center;
            color: #087e91;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🔐</div>

    <h1>TrustVault</h1>

    <p class="subtitle">
        Secure Document Sharing Platform
    </p>

    <h2 class="section-title">Welcome Back</h2>

    <p class="description">
        Sign in to securely access and manage your documents.
    </p>

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input type="text"
               name="username"
               placeholder="Enter your username"
               required>

        <label>Password</label>
        <input type="password"
               name="password"
               placeholder="Enter your password"
               required>

        <button type="submit">Sign In</button>
    </form>

    <p class="security">🛡 Secure Access • Protected Documents</p>

    <p class="footer">
        © 2026 TrustVault. All rights reserved.
    </p>

</div>

</body>
</html>
