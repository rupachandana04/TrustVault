<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Document | TrustVault</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101b35, #087e91);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        }

        h2 {
            color: #172b4d;
            text-align: center;
            margin-bottom: 20px;
        }

        .success-message {
            color: green;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #087e91;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #066575;
        }

        .documents-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #087e91;
            text-decoration: none;
            font-weight: bold;
        }

        .documents-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🔐 Upload Document</h2>

    {% if success_message %}
        <p class="success-message">
            {{ success_message }}
        </p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Document Title:</label>
        <input type="text" name="title"
               placeholder="Enter document title" required>

        <label>Category:</label>
        <input type="text" name="category"
               placeholder="Enter category">

        <label>Select File:</label>
        <input type="file" name="file" required>

        <button type="submit">Upload Document</button>
    </form>

    <a class="documents-link" href="{% url 'document_list' %}">
        📁 View My Documents
    </a>

</div>

</body>
</html>
